<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iNotes - Take your notes easily</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">iNotes</a>
        <span class="navbar-text">Simple FastAPI notes</span>
      </div>
    </nav>

    <main class="container">
      <h1 class="mb-4">Add a note</h1>

      <form method="post" class="mb-5">
        <div class="mb-3">
          <label for="title" class="form-label">Note Title</label>
          <input type="text" class="form-control" id="title" name="title" required>
        </div>

        <div class="mb-3">
          <label for="desc" class="form-label">Note Description</label>
          <textarea class="form-control" id="desc" name="desc" rows="3"></textarea>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" name="important" id="important">
          <label class="form-check-label" for="important">Important</label>
        </div>

        <button type="submit" class="btn btn-primary">Save note</button>
      </form>

      <h2 class="mb-3">Your Notes</h2>

      {% if not newDocs %}
        <div class="alert alert-secondary">No notes yet.</div>
      {% else %}
        <div class="row g-3">
          {% for item in newDocs %}
            <div class="col-md-6 col-lg-4">
              <div class="card h-100">
                <div class="card-body">
                  <h5 class="card-title">
                    {{ item.title }}
                    {% if item.important %}
                      <span class="badge text-bg-warning">Important</span>
                    {% endif %}
                  </h5>
                  <p class="card-text">{{ item.desc }}</p>
                </div>
              </div>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    </main>
  </body>
</html>
